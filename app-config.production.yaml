# Production config. Every value that differs per environment or is secret comes
# from environment variables set by the Kubernetes Deployment.
app:
  title: IDP Portal
  baseUrl: ${APP_BASE_URL}

# Sign in through an in-window redirect to Keycloak instead of a popup, which
# browsers block by default.
enableExperimentalRedirectFlow: true

backend:
  baseUrl: ${APP_BASE_URL}
  listen: ':7007'
  database:
    client: pg
    # One database with a schema per plugin: the CNPG app user owns the
    # database but cannot create new ones.
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}

auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    oidc:
      production:
        metadataUrl: ${KEYCLOAK_METADATA_URL}
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            # Users come from the Keycloak realm through catalog.providers.keycloakOrg,
            # so only people synced into the catalog can sign in.
            - resolver: emailMatchingUserEntityProfileEmail

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        # No token: the plugin uses the pod's service account (read-only RBAC).
        - name: k3s
          url: https://kubernetes.default.svc
          authProvider: serviceAccount

catalog:
  rules:
    - allow:
        [
          Component,
          System,
          API,
          Resource,
          Location,
          Domain,
          Group,
          User,
          Template,
        ]
  locations:
    - type: url
      target: https://github.com/platform-matuuu60/backstage/blob/main/catalog/all.yaml
  providers:
    # Users and groups are owned by Keycloak (realm idp); the catalog mirrors them.
    keycloakOrg:
      default:
        baseUrl: ${KEYCLOAK_BASE_URL}
        loginRealm: idp
        realm: idp
        clientId: ${KEYCLOAK_CATALOG_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CATALOG_CLIENT_SECRET}
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 2 }
          initialDelay: { seconds: 30 }
