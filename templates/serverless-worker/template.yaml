apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: serverless-worker
  title: Serverless Worker
  description: >-
    Python worker that consumes its own SQS queue on Lambda, with a dead-letter queue
    and partial batch retries, provisioned by Crossplane. Creates the repository with CI
    (security scan, tests, deploy from the idp-k3s runners) and opens a pull request to
    the gitops repository with the ServerlessWorker claim.
    The owner team must already have its namespace in gitops (teams/<team>).
  tags: [python, lambda, sqs, serverless, async]
spec:
  owner: group:default/platform-team
  type: worker

  parameters:
    - title: Worker
      required: [name, owner]
      properties:
        name:
          title: Name
          type: string
          description: Repository and worker name. Lowercase letters, digits and dashes.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          default: Queue worker
        owner:
          title: Owner team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
    - title: Deployment
      properties:
        target:
          title: Target
          type: string
          description: Where Crossplane provisions the function.
          enum: [floci]
          enumNames: ['Floci (local AWS emulator)']
          default: floci
        batchSize:
          title: Batch size
          type: integer
          description: Messages delivered to the function per invocation.
          minimum: 1
          maximum: 10
          default: 10
        maxReceiveCount:
          title: Attempts before dead-letter
          type: integer
          description: Deliveries of a failing message before it moves to the dead-letter queue.
          minimum: 1
          maximum: 10
          default: 3

  steps:
    - id: app
      name: Render worker
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./app
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          team: ${{ parameters.owner | parseEntityRef | pick('name') }}
          batchSize: ${{ parameters.batchSize }}
          maxReceiveCount: ${{ parameters.maxReceiveCount }}

    - id: publish
      name: Create repository
      action: publish:github
      input:
        repoUrl: github.com?owner=platform-matuuu60&repo=${{ parameters.name }}
        sourcePath: ./app
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        deleteBranchOnMerge: true
        protectDefaultBranch: false

    - id: claim
      name: Render ServerlessWorker claim
      action: fetch:template
      input:
        url: ./gitops
        targetPath: ./gitops/teams/${{ parameters.owner | parseEntityRef | pick('name') }}
        values:
          name: ${{ parameters.name }}
          team: ${{ parameters.owner | parseEntityRef | pick('name') }}
          target: ${{ parameters.target }}
          batchSize: ${{ parameters.batchSize }}
          maxReceiveCount: ${{ parameters.maxReceiveCount }}

    - id: gitops-pr
      name: Open gitops pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=platform-matuuu60&repo=gitops
        sourcePath: ./gitops
        branchName: scaffolder/${{ parameters.name }}
        title: 'feat(${{ parameters.owner | parseEntityRef | pick("name") }}): add ServerlessWorker ${{ parameters.name }}'
        description: |
          Created from the Backstage template **Serverless Worker**.

          Merging this provisions the queue, its dead-letter queue, the function and an
          IAM role scoped to the queue on `${{ parameters.target }}` through Crossplane.
          The worker CI publishes the code package to
          `idp-artifacts/${{ parameters.name }}/latest.zip`.

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Gitops pull request
        url: ${{ steps['gitops-pr'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
