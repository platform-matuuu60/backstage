# Generated by the Backstage template "Serverless API".
# Infrastructure (function, role, HTTP API) is declared in the gitops repository and
# provisioned by Crossplane; this pipeline only ships the code.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    uses: platform-matuuu60/platform/.github/workflows/security-scan.yaml@main

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [security, test]
    uses: platform-matuuu60/platform/.github/workflows/deploy-function.yaml@main
    with:
      function-name: ${{ values.team }}-${{ values.name }}
      artifact-key: ${{ values.name }}/latest.zip
